name: Build desktop apps

# Builds the macOS (.dmg/.zip) and Windows (.exe) desktop apps on GitHub's
# runners and, when you push a version tag (e.g. v0.1.0), attaches them to a
# GitHub Release you can download. Also runnable on demand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web UI
        run: pnpm build

      - name: Bundle standalone server
        run: pnpm bundle:server

      - name: Install desktop (Electron) dependencies
        working-directory: desktop
        run: npm install

      - name: Build installer
        working-directory: desktop
        env:
          # Unsigned build — don't try to discover a macOS signing identity.
          CSC_IDENTITY_AUTODISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never

      - name: Upload installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flight-tracker-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: warn

      - name: Attach installers to the release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
